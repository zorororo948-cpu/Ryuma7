name: Run Ryuma

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -framework UIKit \
            -framework Foundation \
            RyumaOnly.m \
            -o RyumaOnly.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: RyumaOnly
          path: RyumaOnly.dylib
